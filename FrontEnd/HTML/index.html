<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traditional Knowledge Repository</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <div class="brand">
        <h1>Traditional Knowledge Repository</h1>
        <p>Warumungu community, Tennant Creek</p>
      </div>
      <div class="tools">
        <button id="textBtn" class="tool" type="button"></button>
        <button id="easyBtn" class="tool" type="button" aria-pressed="false"></button>
        <div id="auth" class="auth"></div>
      </div>
    </div>
    <nav class="wrap" aria-label="Main">
      <button data-view="search"><i data-icon="search"></i> Search</button>
      <button data-view="browse"><i data-icon="book-open"></i> Browse</button>
      <button data-view="submit"><i data-icon="upload"></i> Submit</button>
      <button data-view="review" id="reviewBtn" hidden><i data-icon="clipboard-check"></i> Review queue <span id="count" class="count" hidden>0</span></button>
    </nav>
  </header>
  <section class="wrap hero">
    <p class="hero-title">Knowledge stays with the people who own it.</p>
    <p class="hero-sub">Nothing is published until an authorised elder or reviewer approves it.</p>
  </section>
  <main id="app" class="wrap"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer class="wrap site-footer"><span id="mode"></span> Prototype: sign-in here is a demo only; server-side access enforcement is still being built.</footer>
  <script src="../JS/icons.js"></script>
  <script src="../JS/app.js"></script>
</body>
</html>
